name: CI

# One workflow, one source of truth per gate.
#
# ci.yml and test.yml used to run largely the same backend, admin and mobile
# gates from two files: backend tests twice, admin suites twice, mobile
# install/source checks twice, and the copies drifted — the spec/docs/test steps
# ended up under the wrong job after a duplicated `steps:` key, and the mobile
# "syntax check" in one file could not fail at all (it ended in `|| echo`).
# Every gate now runs exactly once, from this file.
#
# The backend gate runs `npm run verify` instead of re-listing its steps: that
# chain is defined once in backend/package.json, so a gate added there cannot be
# forgotten here. The only extra step is the docs build, which needs git to
# prove the committed docs/ output matches what docs:build produces.
#
# The workflow-file guard still runs from a second workflow (docs.yml), because
# a workflow that does not parse never starts its own jobs: if THIS file were
# the broken one, only another workflow could report it.

on:
  # Union of what the two workflows watched, so nothing stops being covered.
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # The suite must pass on the oldest supported runtime and the current one;
      # ci.yml tested 20 + 22, and the dependencies are installed with `npm ci`
      # so the lockfile must stay in sync with package.json.
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      # The verify chain is split into individually-named steps so that when
      # one of them fails — as the Node 20 leg did on the first push of the
      # consolidated workflow — CI reports the exact step rather than a
      # monolithic "npm run verify" with no way to tell which sub-step died.
      # The single-chain form still exists in backend/package.json for local
      # use; CI spells out the steps so the next run is diagnosable without
      # the step logs (which the anonymous API cannot read).
      - name: Validate the OpenAPI spec
        run: npm run docs:validate

      - name: Audit routes vs the spec
        run: npm run spec:audit

      - name: Validate workflow files and npm-script references
        run: npm run workflows:check

      - name: Check generated client freshness
        run: npm run client:check

      - name: Build the algorithms slide deck and verify it is committed
        run: npm run slides:check

      - name: Run the backend test suites
        run: npm test

      - name: Build static docs and verify they are committed
        run: |
          npm run docs:build
          git diff --exit-code -- ../docs/ || (echo 'docs/ is out of date. Run: cd backend && npm run docs:build' && exit 1)

  migration-catalog:
    # Catalog drift guard for the SQLite → Firestore migration pipeline.
    # Seeds a FRESH temp SQLite DB from the committed product catalog and runs
    # the exact pipeline `npm run migrate:firestore -- --dry-run` uses
    # (dumpSnapshot → transformSnapshot), then FAILS if the transform output
    # doesn't reproduce the committed catalog (products.json, inventory.json,
    # stock_movements.json, order_inquiries.json). Catches a dropped field, a
    # changed stock draw, or a catalog/seed/transform drift that would push
    # wrong data to Firestore on the next migration.
    name: Migration catalog drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify the migration transform reproduces the committed catalog
        run: npm run migrate:check

  admin:
    name: Admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend-admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Run admin tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The E2E specs drive the real API, and the npm-free server is only
      # "npm-free" about native drivers: it still requires express, bcryptjs,
      # cors and jsonwebtoken from backend/node_modules. Without this install
      # the server dies with MODULE_NOT_FOUND and the health check below fails.
      - name: Install backend dependencies for the E2E server
        working-directory: ./backend
        run: npm ci

      - name: Start the npm-free backend for E2E
        working-directory: ./backend
        run: |
          node src/server_npmfree.js &
          sleep 5
          curl -f http://localhost:4001/api/health || exit 1

      - name: Build admin against the local API
        run: REACT_APP_API_BASE_URL=http://localhost:4001 npm run build

      - name: Run Playwright E2E tests
        run: npx vite preview --port 4173 & sleep 3 && npx playwright test e2e/admin-login.spec.js e2e/order-flow.spec.js --reporter=list
        env:
          CI: true

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./mobile-client/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Check screen structure (both Expo apps)
        # Dependency-free node guard, so it covers BOTH Expo apps from this
        # job: every screen must live in its navigator's section folder and
        # none may be orphaned. See scripts/check-app-structure.js.
        run: node ../scripts/check-app-structure.js ../mobile-client ../staff-client

      # The Metro export below replaces the two checks this file and ci.yml ran
      # before: a `node -e require(...)` syntax probe wrapped in `|| echo` and a
      # readFileSync loop, neither of which could ever fail a build while the
      # bundle really could break. `expo export` runs a full production build
      # (Hermes compile + asset export), which is what catches a missing entry
      # point or an unresolvable Babel preset.
      - name: Export Android bundle (Metro + Hermes smoke test)
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo export --platform android
          echo '--- exported artifacts ---'
          ls -R dist 2>/dev/null | head -30 || true

      - name: Assert the JS bundle was produced
        run: |
          BUNDLES=$(find dist -type f \( -name '*.hbc' -o -name '*.bundle' \) | wc -l)
          echo "bundle files found: $BUNDLES"
          if [ "$BUNDLES" -eq 0 ]; then
            echo '::error::No Android bundle was produced by expo export'
            exit 1
          fi

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The two scans run FIRST and the audits after them: a failing step skips
      # every later step in the job, so with the audits first a red dependency
      # audit silently took the secret scan down with it — which is what happened
      # on every run this pipeline has done. Scans need no install; they have no
      # business queueing behind one.
      - name: Scan the tracked tree for secrets
        # Sensitive literal patterns are split below so this workflow does not
        # accidentally detect its own secret-scanning expression.
        #
        # The key pattern needs key MATERIAL, and grep matches one line at a
        # time, so both shapes a real leak takes are spelled out:
        #   - a committed .pem/.key file: the header is the whole line, so it is
        #     anchored to end-of-line. Matching the bare header anywhere was not
        #     an option: backend/src/store-firestore.js builds a PEM from an env
        #     var, so it holds the header mid-line on purpose, and a pattern that
        #     matched that turned the scan into a permanent failure.
        #   - a service-account JSON: the PEM sits inside a JSON string on one
        #     line, so its line breaks are the two characters \ and n. The
        #     backslash and the n go in ONE bracket expression: outside one, this
        #     grep reads `\n` as a literal `n`, so the escaped form never
        #     matched — and a class of whitespace alone cannot match it either,
        #     nor a real newline (a single grep line never contains one). A
        #     committed key body therefore went undetected (verified by
        #     running this step against a planted key).
        #
        # `-e "$PATTERN"` is load-bearing: the pattern begins with `-`, so grep
        # parsed it as a pile of options, errored, and `|| true` swallowed that
        # into an empty hit list. The step printed its success line and passed on
        # every run without reading a single file. Verified against a planted
        # key both ways: without `-e` a committed PEM is invisible, with it the
        # step fails on the planted file.
        run: |
          set -euo pipefail

          PATTERN='-----BEGIN [A-Z ]*PRIVATE '"KEY"'-----[\n[:space:]]*[A-Za-z0-9+/]{40,}|-----BEGIN [A-Z ]*PRIVATE '"KEY"'-----[[:space:]]*$|firebase-'"adminsdk"'|GOCSPX-[A-Za-z0-9_-]{10,}|re_[A-Za-z0-9]{20,}'

          HITS=$(grep -rInE -e \
            "$PATTERN" \
            --exclude-dir=node_modules \
            --exclude-dir=build \
            --exclude-dir=dist \
            --exclude-dir=.git \
            --exclude-dir=.secrets \
            . || true)

          if [ -n "$HITS" ]; then
            echo '::error::Possible secret committed — remove it and rotate the key:'
            echo "$HITS"
            exit 1
          fi

          echo 'No secrets found in the tracked tree.'

      - name: Scan backend sources for hardcoded passwords
        # The previous form piped into `head` and tested THAT status, which is 0
        # whether or not anything matched — so this step failed on every run,
        # including runs with nothing to report. Capture the hits and test them.
        # The pattern now wants a quoted literal directly after the assignment
        # (`password = 'hunter2'`) instead of any quote later on the line, which
        # is what made it flag `password = ?` and `password !== 'string'`.
        run: |
          HITS=$(grep -rnE "(password|passwd|pwd)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{3,}['\"]" backend/src --include="*.js" \
            | grep -vE "[:=][[:space:]]*['\"][*•]{3,}['\"]" \
            | grep -vE "(process\.env|hashPassword|verifyPassword|passwordError|bcrypt|placeholder|example|demo|TODO|FIXME|\.test\.)" || true)
          if [ -n "$HITS" ]; then
            echo '::error::Potential hardcoded password found:'
            echo "$HITS"
            exit 1
          fi
          echo '✅ No hardcoded passwords found'

      # Audit only reads the lockfiles, so no install is needed.
      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Audit admin dependencies
        working-directory: ./frontend-admin
        run: npm audit --audit-level=high
