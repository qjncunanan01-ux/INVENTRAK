name: INVENTRAK CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests (npm-free fallback)
        run: npm test

  admin-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-admin/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build

  mobile-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './mobile-client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npx expo export --platform web 2>/dev/null || true
