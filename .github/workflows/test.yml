name: INVENTRAK CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    # Purge Git secrets (prevention half): fail CI if any known secret pattern
    # or private key shows up in the tracked working tree. The repo was
    # already scrubbed; this job keeps it that way on every push. Runs on the
    # checkout only (never on git history, which needs a paid plan to rewrite).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tracked tree for secrets
        run: |
          set -euo pipefail
          HITS=$(grep -rInE \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|firebase-adminsdk|GOCSPX-[A-Za-z0-9_-]{10,}|re_[A-Za-z0-9]{20,}' \
            --exclude-dir=node_modules --exclude-dir=build --exclude-dir=dist \
            --exclude-dir=.git --exclude-dir=.secrets . || true)
          if [ -n "$HITS" ]; then
            echo '::error::Possible secret committed — remove it and rotate the key:'
            echo "$HITS"
            exit 1
          fi
          echo 'No secrets found in the tracked tree.'

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install backend dependencies
        run: npm install

      - name: Validate OpenAPI spec against OAS 3.0.3
        run: npm run docs:validate

      - name: Audit route <-> spec coverage
        run: npm run spec:audit

      - name: Check generated API clients are current
        run: npm run client:check

      - name: Build static docs and verify they are committed
        run: |
          npm run docs:build
          git diff --exit-code -- ../docs/ || (echo 'docs/ is out of date. Run: cd backend && npm run docs:build' && exit 1)

      - name: Run backend tests (SQLite + npm-free + contract + openapi)
        run: npm test

  migration-catalog:
    # Catalog drift guard for the SQLite → Firestore migration pipeline.
    # Seeds a FRESH temp SQLite DB from the committed product catalog and runs
    # the exact pipeline `npm run migrate:firestore -- --dry-run` uses
    # (dumpSnapshot → transformSnapshot), then FAILS if the transform output
    # doesn't reproduce the committed catalog (products.json, inventory.json,
    # stock_movements.json, order_inquiries.json). Catches a dropped field, a
    # changed stock draw, or a catalog/seed/transform drift that would push
    # wrong data to Firestore on the next migration.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install backend dependencies
        run: npm install

      - name: Verify the migration transform reproduces the committed catalog
        run: npm run migrate:check

  admin-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-admin/package-lock.json'

      - name: Install admin dependencies
        run: npm install

      - name: Run admin smoke tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Run build check
        env:
          CI: false
        run: npm run build

  mobile-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './mobile-client/package-lock.json'

      - name: Install mobile dependencies
        run: npm install

      - name: Validate JS files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = path.join(process.cwd(), "src");
            let errors = 0;
            function walk(d) {
              fs.readdirSync(d).forEach(function (f) {
                const fp = path.join(d, f);
                if (fs.statSync(fp).isDirectory()) {
                  walk(fp);
                } else if (f.endsWith(".js")) {
                  try {
                    fs.readFileSync(fp, "utf8");
                    console.log("OK: " + path.relative(process.cwd(), fp));
                  } catch (ex) {
                    console.log("FAIL: " + fp);
                    errors++;
                  }
                }
              });
            }
            walk(dir);
            if (errors) process.exit(1);
          '

  mobile-bundle:
    # Metro bundle smoke test: `expo export` runs a full production build of the
    # Android app (Hermes compile + asset export). This catches the failures that
    # broke the app before — a missing entry point (index.js / registerRootComponent)
    # or an unresolvable Babel preset (babel-preset-expo) — on every push, long
    # before anyone opens Expo Go. Fails CI on any bundling/transform error.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './mobile-client/package-lock.json'

      - name: Install mobile dependencies
        run: npm install

      - name: Export Android bundle (Metro + Hermes smoke test)
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo export --platform android
          echo '--- exported artifacts ---'
          ls -R dist 2>/dev/null | head -30 || true

      - name: Assert the JS bundle was produced
        run: |
          BUNDLES=$(find dist -type f \( -name '*.hbc' -o -name '*.bundle' \) | wc -l)
          echo "bundle files found: $BUNDLES"
          if [ "$BUNDLES" -eq 0 ]; then
            echo '::error::No Android bundle was produced by expo export'
            exit 1
          fi
