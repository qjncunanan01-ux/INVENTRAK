name: INVENTRAK CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install backend dependencies
        run: npm install

      - name: Validate OpenAPI spec against OAS 3.0.3
        run: npm run docs:validate

      - name: Audit route <-> spec coverage
        run: npm run spec:audit

      - name: Check generated API clients are current
        run: npm run client:check

      - name: Build static docs and verify they are committed
        run: |
          npm run docs:build
          git diff --exit-code -- ../docs/ || (echo 'docs/ is out of date. Run: cd backend && npm run docs:build' && exit 1)

      - name: Run backend tests (SQLite + npm-free + contract + openapi)
        run: npm test

  admin-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-admin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-admin/package-lock.json'

      - name: Install admin dependencies
        run: npm install

      - name: Run admin smoke tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Run build check
        env:
          CI: false
        run: npm run build

  mobile-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './mobile-client/package-lock.json'

      - name: Install mobile dependencies
        run: npm install

      - name: Validate JS files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = path.join(process.cwd(), "src");
            let errors = 0;
            function walk(d) {
              fs.readdirSync(d).forEach(function (f) {
                const fp = path.join(d, f);
                if (fs.statSync(fp).isDirectory()) {
                  walk(fp);
                } else if (f.endsWith(".js")) {
                  try {
                    fs.readFileSync(fp, "utf8");
                    console.log("OK: " + path.relative(process.cwd(), fp));
                  } catch (ex) {
                    console.log("FAIL: " + fp);
                    errors++;
                  }
                }
              });
            }
            walk(dir);
            if (errors) process.exit(1);
          '
