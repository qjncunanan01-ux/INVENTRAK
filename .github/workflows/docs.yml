name: Deploy API Docs to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Allow one concurrent deployment; never cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

      - name: Validate OpenAPI spec against OAS 3.0.3
        run: npm run docs:validate
        working-directory: ./backend

      - name: Build static docs site
        run: npm run docs:build
        working-directory: ./backend

      # --- Mobile app as a static web build (served at /app/) ---
      # Expo web export with the DEPLOYED API URL baked in, then a small
      # post-processor rewrites asset paths to relative so the app works
      # under the /INVENTRAK/app/ subpath. The result lands in docs/app/
      # so one Pages deploy serves BOTH the API docs (/) and the app (/app/).
      - name: Install mobile-client dependencies
        run: npm install
        working-directory: ./mobile-client

      - name: Export mobile app as a static web build
        run: EXPO_PUBLIC_API_URL=https://inventrak-api.onrender.com npx expo export --platform web
        working-directory: ./mobile-client
        env:
          CI: "1"

      - name: Make asset paths relative (subpath hosting)
        run: node scripts/relativize-web-export.js
        working-directory: ./mobile-client

      - name: Stage mobile app under docs/app/
        run: |
          mkdir -p ../docs/app
          cp -r dist/. ../docs/app/
        working-directory: ./mobile-client

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
