# Replit config — workspace Run + Deployments/Publish.
#
# [run]    → what the workspace **Run** button executes (this was missing, so
#            Run had nothing to launch and the app exited instantly).
# [deployment] → what Publish uses to build and start the app (port 3000 is
#            what Replit's published apps expose).
#
# --ignore-scripts: skips compiling better-sqlite3 (a native dep the npm-free
# server never loads) so npm install can't fail on Replit's build machines.
[run]
command = "cd backend && npm install --ignore-scripts && PORT=3000 node src/server_npmfree.js"

[deployment]
build = "cd backend && npm install --ignore-scripts"
run = "cd backend && PORT=3000 node src/server_npmfree.js"
