version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    volumes:
      - backend_data:/app/data
    environment:
      - PORT=4001

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:4001

volumes:
  backend_data:
