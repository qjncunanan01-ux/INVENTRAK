# Render Blueprint — one-click deploy for INVENTRAK.
#
# CURRENT schema: services use `runtime: <type>` and `rootDir` (the old
# `env:` / `rootDirectory` field names are rejected by today's validator).
#
# Deploy: push this repo to GitHub → render.com → New → Blueprint → pick the
# repo → Render reads this file and creates both services. Full runbook with
# the Firebase setup and admin/mobile URL steps: see DEPLOY.md.
#
# The API runs the unified npm-free server: local JSON files by default, and
# AUTO-SELECTS Firebase Firestore whenever FIREBASE_PROJECT_ID + a service
# account are set. FIREBASE_SERVICE_ACCOUNT_JSON is a SECRET — do not put it
# in this file; paste it in the dashboard after deploy:
#   Service → Environment → Environment Variables
#   FIREBASE_SERVICE_ACCOUNT_JSON = <the whole JSON, including braces>

services:
  # ---------- Backend API ----------
  - type: web
    name: inventrak-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server_npmfree.js
    # Render pings this to judge health; / would 404, this returns 200.
    healthCheckPath: /api/openapi.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your real Firebase project id. Without a service-account JSON the API
      # still runs on the local JSON files (ephemeral disk on the free plan).
      - key: FIREBASE_PROJECT_ID
        value: inventrak-6b079

      # Real email + SMS delivery (see DEPLOY.md -> "Real email + SMS
      # notifications"). Without these, notifications are LOGGED, not sent.
      # These are SECRETS — paste the real values in the dashboard after the
      # blueprint creates the service (do NOT commit them here).
      # Email (pick ONE option):
      #   Generic SMTP (delivers to ANY recipient — recommended):
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   value: you@gmail.com
      # - key: SMTP_PASS
      #   value: xxxx xxxx xxxx xxxx
      # - key: EMAIL_FROM
      #   value: "INVENTRAK <you@gmail.com>"
      #   ...or Resend (owner-inbox-only until a domain is verified):
      # - key: RESEND_API_KEY
      #   value: re_xxx
      # - key: EMAIL_FROM
      #   value: "INVENTRAK <onboarding@resend.dev>"
      # SMS (Semaphore):
      # - key: SEMAPHORE_API_KEY
      #   value: xxx
      # - key: SEMAPHORE_SENDER_NAME
      #   value: INVENTRAK

  # ---------- Admin dashboard (static site) ----------
  - type: web
    name: inventrak-admin
    runtime: static
    rootDir: frontend-admin
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Baked into the JS bundle at build time (CRA REACT_APP_* convention).
      # Match this to the URL Render assigns the api service above.
      - key: REACT_APP_API_BASE_URL
        value: https://inventrak-api.onrender.com
    # SPA fallback: client-side routes (/products, /inventory, ...) must
    # rewrite to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- Mobile app (customer-facing static web build) ----------
  # The SAME React Native app exported for the browser (react-native-web), so
  # anyone can open the storefront from a phone/desktop browser at a PERMANENT
  # URL — no Expo Go, no dev PC, no tunnel. The deployed API URL is baked into
  # the bundle at build time via EXPO_PUBLIC_API_URL.
  - type: web
    name: inventrak-mobile
    runtime: static
    rootDir: mobile-client
    buildCommand: npm install && EXPO_PUBLIC_API_URL=https://inventrak-api.onrender.com npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://inventrak-api.onrender.com
