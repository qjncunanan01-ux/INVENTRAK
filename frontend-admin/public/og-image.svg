<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f640e"/>
      <stop offset="100%" style="stop-color:#2a8a12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Official Sylver logo symbol -->
  <image href="/sylver-symbol.png" x="80" y="180" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
  <!-- Title -->
  <text x="220" y="225" font-family="Arial,sans-serif" font-weight="900" font-size="72" fill="white">Sylver's</text>
  <text x="220" y="275" font-family="Arial,sans-serif" font-weight="400" font-size="28" fill="rgba(255,255,255,0.85)">Admin Dashboard</text>
  <!-- Tagline -->
  <text x="80" y="380" font-family="Arial,sans-serif" font-weight="400" font-size="24" fill="rgba(255,255,255,0.7)">Inventory Tracking &amp; Management System</text>
  <text x="80" y="420" font-family="Arial,sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.5)">Sylver Restaurant and Coffee Supplies</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.15)"/>
  <text x="80" y="612" font-family="Arial,sans-serif" font-weight="400" font-size="16" fill="rgba(255,255,255,0.6)">inventrak-admin.onrender.com</text>
</svg>
